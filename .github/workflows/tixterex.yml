# R93 (same build/deploy contract as R92): one explicit artifact, validated package, scoped caches, visible supply health.
# This workflow builds and deploys. It does NOT crawl third-party sites on GitHub.
name: TixTerex validate and deploy
"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/tixterex.yml'
      - 'site/**'
      - 'src/**'
      - 'tools/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source:
        description: 'Use the release ZIPs or the checked-in source tree'
        type: choice
        options: [release, repository]
        default: release
      release_tag:
        description: 'Exact release tag; blank uses the latest published release'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: tixterex-pages
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    outputs:
      build_here: ${{ steps.route.outputs.build_here }}
    steps:
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          WF: ${{ github.workflow_ref }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = release ]; then
            F=$(basename "${WF%@*}")
            B=$(gh api "repos/$REPO" --jq .default_branch)
            gh workflow run "$F" --repo "$REPO" --ref "$B" -f source=release -f "release_tag=$TAG"
            echo 'build_here=false' >> "$GITHUB_OUTPUT"
            echo "Release $TAG handed to the default branch $B with the exact tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build_here=true' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: route
    if: needs.route.outputs.build_here == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select exactly one artifact source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_SOURCE: ${{ inputs.source }}
          CONFIG_SOURCE: ${{ vars.TIXTEREX_ARTIFACT_SOURCE }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          SOURCE="${INPUT_SOURCE:-${CONFIG_SOURCE:-release}}"
          if [ "$SOURCE" = repository ]; then
            test -f site/index.html
            test -f tools/release/assemble.py
            echo 'TF_INPUT=.' >> "$GITHUB_ENV"
            echo 'TF_ARTIFACT=repository' >> "$GITHUB_ENV"
            echo 'Artifact: checked-in repository source.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SOURCE" = release ]; then
            if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG=$(gh release view -R "$REPO" --json tagName --jq .tagName); fi
            mkdir -p _release_assets _package
            for ASSET in tixterex-release.zip tixterex-places-1.zip tixterex-places-2.zip; do
              gh release download "$RELEASE_TAG" -R "$REPO" --pattern "$ASSET" --dir _release_assets --clobber
            done
            if gh release view "$RELEASE_TAG" -R "$REPO" --json assets --jq '.assets[].name' | grep -qx 'tixterex-inventory.zip'; then
              gh release download "$RELEASE_TAG" -R "$REPO" --pattern tixterex-inventory.zip --dir _release_assets --clobber
            fi
            python3 - <<'PY'
          import pathlib,zipfile,subprocess,sys
          z=zipfile.ZipFile('_release_assets/tixterex-release.zip')
          body=z.read('tixterex/tools/release/verify_inputs.py')
          p=pathlib.Path('_verify_tixterex_inputs.py');p.write_bytes(body)
          subprocess.run([sys.executable,str(p),'_release_assets','_package'],check=True)
          PY
            echo 'TF_INPUT=_package/tixterex' >> "$GITHUB_ENV"
            echo "TF_ARTIFACT=release:$RELEASE_TAG" >> "$GITHUB_ENV"
            echo "Artifact: release **$RELEASE_TAG**, exact three named ZIPs. Repository site is not used." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Invalid source: choose release or repository.' >&2; exit 1
          fi
      - name: Recover existing collection state without rerunning the crawler
        uses: actions/cache/restore@v4
        with:
          path: _ingest
          key: tixterex-read-only-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tixterex-ingest-v2-
            ingest-
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build the tested source and preserve last-good collected data
        env:
          PAGE_BASE: ${{ steps.pages.outputs.base_path }}
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          mkdir -p _reports
          if [ -f "$TF_INPUT/src/manifest.json" ]; then
            python3 "$TF_INPUT/tools/build_site.py" --root "$TF_INPUT" --check
          fi
          BUILD="r92-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 "$TF_INPUT/tools/release/assemble.py" --input "$TF_INPUT" --output _site --cache _ingest --build "$BUILD" --base-path "${PAGE_BASE:-/}" --site-url "$PAGE_URL" > _reports/assembly.json
          python3 "$TF_INPUT/tools/recovery/readiness_gate.py" _site --mode package --output _reports/package-health.json
          python3 "$TF_INPUT/tools/release/check_package.py" _site --output _reports/package-tests.json
          node "$TF_INPUT/tools/cf_budget.mjs" _site --json > _reports/public-output.json
          cp _site/supply-health.json _reports/
          python3 - <<'PY'
          import json,os
          h=json.load(open('_reports/supply-health.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n## Package and event supply are separate\n')
              f.write('Package validation passed. No collection was executed by this deployment.\n\n')
              f.write(f"Collected city files: **{h['cities']}**. Stored occurrences: **{h['occurrences']}**. Future/ongoing stored occurrences: **{h['futureOrOngoingOccurrences']}**.\n\n")
              f.write('Global 100/75 recall: **not measured**.\n')
              if not h['futureOrOngoingOccurrences']:
                  f.write('\n**EVENT SUPPLY NOT READY.** The UI repair can deploy, but the available collected inventory is empty for future dates. Inspect supply-health.json. Browser feeds are independent and are not certified by this job.\n')
          PY
      - name: Retain package and supply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tixterex-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: _reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload only the public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
# No automatic release/cache deletion, DNS changes, API provisioning or host migration.
